<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102943"><meta name="description" content="Convite de casamento de Walquiria e Luís — 04 de setembro de 2027."><title>Walquiria & Luís | Nosso casamento</title>
<style>
:root{--navy:#102943;--gold:#d4ae67;--cream:#fff8e9}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 50% 22%,#264461,#0d233a 72%);color:var(--cream);font-family:Georgia,serif;min-height:100vh;overflow-x:hidden}button,a{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible{outline:3px solid #f9d789;outline-offset:4px}.stage{min-height:100svh;display:grid;place-items:center;padding:30px 14px 48px;position:relative}.stage::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#d6b56f 0.7px,transparent 1px);background-size:47px 53px;opacity:.13}.intro{text-align:center;transition:opacity .6s,transform .6s}.eyebrow{font-size:.75rem;letter-spacing:.26em;color:#e7d0a0;text-transform:uppercase}.intro h1{font-size:clamp(2.1rem,6vw,3.5rem);font-weight:normal;margin:10px 0 7px;font-style:italic}.hint{font-size:.95rem;color:#f3e6ca;margin:28px 0 0;animation:pulse 2.4s infinite}.envelope-scene{position:relative;width:min(86vw,490px);height:min(57vw,320px);max-height:320px;margin:44px auto 12px;perspective:1100px;filter:drop-shadow(0 24px 25px #0007)}.envelope{position:absolute;inset:0;background:#163753;border:2px solid #d7b06b;border-radius:5px;overflow:visible}.envelope::before{content:"";position:absolute;inset:7px;border:1px solid #c69d57a1;pointer-events:none}.pocket{position:absolute;inset:0;z-index:3;background:linear-gradient(140deg,#1e4665,#102c49);clip-path:polygon(0 0,50% 62%,100% 0,100% 100%,0 100%);border-radius:3px}.pocket::after{content:"";position:absolute;inset:0;background:linear-gradient(45deg,transparent 49.8%,#d8b66c 50%,transparent 50.4%);opacity:.4}.letter{position:absolute;z-index:2;width:76%;height:90%;left:12%;top:7%;border:2px solid #d7b46d;background:#f9f0dd url('assets/convite.png') center top / cover no-repeat;box-shadow:0 2px 12px #0005;transition:transform 1.5s cubic-bezier(.18,.8,.25,1);transform:translateY(0)}.flap{position:absolute;z-index:5;left:0;top:0;width:100%;height:70%;transform-origin:top center;transform-style:preserve-3d;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(155deg,#315574,#102a47 70%);transition:transform 1.1s ease;backface-visibility:hidden}.flap::after{content:"";position:absolute;inset:8px;background:linear-gradient(155deg,#d6b36c,#ad7e36);clip-path:polygon(0 0,100% 0,50% 100%,0 0);opacity:.6}.seal{position:absolute;z-index:7;top:55%;left:50%;transform:translate(-50%,-50%);border:2px solid #f0d9a0;width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#e8c27b,#ac752d 76%);box-shadow:0 3px 15px #0008,inset 0 0 0 5px #b7873c,inset 0 0 0 7px #e6c88a;color:#fff2d3;font:italic 32px Georgia,serif;cursor:pointer;transition:opacity .4s,transform .5s}.seal:hover{transform:translate(-50%,-50%) scale(1.08)}.opened .flap{transform:rotateX(180deg);z-index:1}.opened .seal{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.4)}.opened .letter{transform:translateY(-65%)}.intro.depart{opacity:0;transform:translateY(-30px);pointer-events:none}.invitation{display:none;width:min(100%,630px);margin:auto;animation:reveal 1s ease both}.invitation.visible{display:block}.paper{position:relative;width:100%;box-shadow:0 20px 65px #0009;border-radius:3px;overflow:hidden;background:#fff5e4}.paper img{display:block;width:100%;height:auto}.hotspot{position:absolute;top:84.2%;height:12.5%;width:15%;border:0;background:transparent;cursor:pointer;border-radius:30px}.hotspot:hover,.hotspot:focus-visible{background:#d6aa5930}.h-map{left:19.8%}.h-info{left:34.5%}.h-rsvp{left:50.2%}.h-gifts{left:66.5%}.action-row{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:22px 0}.action-row a,.action-row button,.back{font:inherit;font-size:.85rem;letter-spacing:.05em;color:#fff3d6;background:#173a57;border:1px solid #d5ae67;padding:12px 17px;border-radius:28px;text-decoration:none;cursor:pointer}.action-row a:hover,.action-row button:hover,.back:hover{background:#285578}.small-note{text-align:center;color:#e9d9b8;font-size:.8rem;line-height:1.5;margin:8px auto 0}.info-view{display:none;width:min(100%,630px);animation:reveal .5s ease}.info-view.visible{display:block}.info-view img{display:block;width:100%;height:auto;box-shadow:0 20px 65px #0009}.back{margin:0 0 20px}.sparkle{position:fixed;pointer-events:none;width:5px;height:5px;background:#ffdfa0;border-radius:50%;box-shadow:0 0 12px 4px #ffcc6b;animation:float 1.5s ease-out forwards;z-index:30}@keyframes float{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4)}}@keyframes reveal{from{opacity:0;transform:translateY(28px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes pulse{50%{opacity:.5}}@media(max-width:460px){.envelope-scene{margin:55px auto 22px}.seal{width:65px;height:65px;font-size:27px}.stage{padding:22px 10px 35px}.action-row{gap:8px}.action-row a,.action-row button{font-size:.78rem;padding:10px 12px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><main class="stage"><section class="intro" id="intro"><div class="eyebrow">Um convite especial para você</div><h1>Walquiria & Luís</h1><div class="eyebrow">04 • 09 • 2027</div><div class="envelope-scene"><div class="envelope" id="envelope"><div class="letter" aria-hidden="true"></div><div class="pocket"></div><div class="flap"></div><button class="seal" id="seal" aria-label="Abrir o convite de casamento">W<span style="font-size:.5em">&</span>L</button></div></div><p class="hint">✧ Toque no selo para abrir ✧</p></section>
<section class="invitation" id="invitation" aria-label="Convite de casamento"><div class="paper"><img src="assets/convite.png" alt="Convite de casamento de Walquiria e Luís, sábado, 04 de setembro de 2027, às 18 horas, Salão Nettu's, Rua Campos Sales, 317, Fragata, Pelotas/RS" width="1024" height="1536"><a class="hotspot h-map" aria-label="Como chegar: abrir Google Maps" href="https://www.google.com/maps/search/?api=1&query=Sal%C3%A3o%20Nettu%27s%2C%20Rua%20Campos%20Sales%20317%2C%20Pelotas%20RS" target="_blank" rel="noopener"></a><button class="hotspot h-info" aria-label="Abrir informações do casamento" id="infoButton"></button><a class="hotspot h-rsvp" aria-label="Confirmar presença" href="https://docs.google.com/forms/d/e/1FAIpQLSfAOx_-oepcIIUS5FuQ7V20V1HXz7mK_0pTkVRZxAWeZGrNbQ/viewform" target="_blank" rel="noopener"></a><a class="hotspot h-gifts" aria-label="Abrir lista de presentes" href="https://walquiiiria.github.io/casamento-wl/" target="_blank" rel="noopener"></a></div><p class="small-note">Toque nos ícones do convite para explorar as informações.</p><div class="action-row"><a href="https://www.google.com/maps/search/?api=1&query=Sal%C3%A3o%20Nettu%27s%2C%20Rua%20Campos%20Sales%20317%2C%20Pelotas%20RS" target="_blank" rel="noopener">Como chegar ↗</a><button id="infoTextButton">Informações</button><a href="https://docs.google.com/forms/d/e/1FAIpQLSfAOx_-oepcIIUS5FuQ7V20V1HXz7mK_0pTkVRZxAWeZGrNbQ/viewform" target="_blank" rel="noopener">Confirmar presença ↗</a><a href="https://walquiiiria.github.io/casamento-wl/" target="_blank" rel="noopener">Lista de presentes ↗</a></div></section>
<section class="info-view" id="infoView" aria-label="Informações para os convidados"><button class="back" id="back">← Voltar ao convite</button><img src="assets/informacoes.png" alt="Informações: cerimônia às 18 horas, cerimônia e recepção no mesmo local, sem traje específico; pedimos evitar azul-marinho, branco e off-white. O mais importante é ter você conosco!" width="1024" height="1536"></section></main>
<script>
const intro=document.getElementById('intro'),envelope=document.getElementById('envelope'),invite=document.getElementById('invitation'),info=document.getElementById('infoView');let started=false;
function sparkle(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<28;i++){const s=document.createElement('span');s.className='sparkle';s.style.left=(45+Math.random()*10)+'vw';s.style.top=(30+Math.random()*35)+'vh';s.style.setProperty('--dx',(Math.random()*400-200)+'px');s.style.setProperty('--dy',(Math.random()*360-180)+'px');document.body.append(s);setTimeout(()=>s.remove(),1600)}}
document.getElementById('seal').addEventListener('click',()=>{if(started)return;started=true;envelope.classList.add('opened');sparkle();setTimeout(()=>intro.classList.add('depart'),1700);setTimeout(()=>{intro.style.display='none';invite.classList.add('visible');window.scrollTo({top:0,behavior:'instant'})},2250)});
function showInfo(){invite.classList.remove('visible');info.classList.add('visible');window.scrollTo({top:0,behavior:'instant'})}function showInvite(){info.classList.remove('visible');invite.classList.add('visible');window.scrollTo({top:0,behavior:'instant'})}document.getElementById('infoButton').addEventListener('click',showInfo);document.getElementById('infoTextButton').addEventListener('click',showInfo);document.getElementById('back').addEventListener('click',showInvite);
</script></body></html>
